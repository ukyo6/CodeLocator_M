apply plugin: 'java-library'

def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('local.properties')
if (uploadPropertiesFile.exists()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}
def uploadGradlePluginUrl = uploadProperties.getProperty('customUploadGradlePluginUrl')
if (uploadGradlePluginUrl != null) {
    apply from: uploadGradlePluginUrl
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api "com.google.code.gson:gson:2.8.5"
}

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

